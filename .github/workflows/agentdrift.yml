name: AgentDrift Sentinel Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-agent-drift:
    name: Audit Agent Context Drift
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AgentDrift Sentinel
        uses: skyinc9/agentdrift-sentinel@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-drift: false
          auto-suggest-fixes: true
          comment-on-pr: true
